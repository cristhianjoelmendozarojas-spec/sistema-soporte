{% extends 'base.html' %}
{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<h2>{{ titulo }}</h2>
<form method="post" class="card card-body">
    {% csrf_token %}
    {{ form.as_p }}
    <div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'forms:asignacion_list' %}" class="btn btn-secondary">Cancelar</a>
    </div>
</form>
{% endblock %}
