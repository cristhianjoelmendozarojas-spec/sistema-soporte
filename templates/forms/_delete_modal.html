<div id="modal-delete" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:var(--radius-lg);width:90%;max-width:400px;box-shadow:var(--shadow-lg);text-align:center;padding:2rem;">
    <div style="font-size:2.5rem;margin-bottom:.75rem;">⚠️</div>
    <p style="font-size:.9rem;font-weight:600;color:var(--navy);margin-bottom:.3rem;">Eliminar acta <strong id="delete-codigo"></strong>?</p>
    <p style="font-size:.75rem;color:var(--text-muted);margin-bottom:1.25rem;">Esta accion no se puede deshacer.</p>
    <form id="form-delete" method="post" action="" style="display:flex;gap:.5rem;justify-content:center;">
      {% csrf_token %}
      <input type="hidden" name="pk" id="delete-pk" value="">
      <button type="submit" class="btn btn-danger">Si, eliminar</button>
      <button type="button" id="delete-cancel" class="btn btn-outline" onclick="closeDeleteModal()">Cancelar</button>
    </form>
  </div>
</div>

<script>
(function() {
  var DELETE_URL_TPL = '{% url "forms:asignacion_delete" 999999 %}';
  var modal = document.getElementById('modal-delete');
  if (!modal) return;
  var form = document.getElementById('form-delete');
  var pkInput = document.getElementById('delete-pk');
  var codigoSpan = document.getElementById('delete-codigo');

  document.querySelectorAll('.btn-delete').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var pk = this.dataset.pk;
      pkInput.value = pk;
      codigoSpan.textContent = this.dataset.codigo;
      form.action = DELETE_URL_TPL.replace('999999', pk);
      modal.style.display = 'flex';
    });
  });

  function closeModal() {
    modal.style.display = 'none';
  }
  document.getElementById('delete-cancel').addEventListener('click', closeModal);
  modal.addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });
  window.closeDeleteModal = closeModal;
})();
</script>
