{% extends 'base.html' %}
{% block title %}Cambiar Contrasena{% endblock %}
{% block content %}
<div style="display:flex;justify-content:center;align-items:center;min-height:60vh;">
  <div class="card" style="max-width:440px;width:100%;">
    <div class="card-header" style="justify-content:center;border-top-color:var(--yellow);">
      🔒 Cambio de Contrasena Requerido
    </div>
    <div class="card-body" style="text-align:center;">
      <p style="font-size:.82rem;color:var(--text-muted);margin-bottom:1.25rem;">
        Por seguridad, debes cambiar tu contrasena antes de continuar.
      </p>
      <form method="post" style="text-align:left;">
        {% csrf_token %}
        <div class="form-group" style="margin-bottom:.85rem;">
          <label class="form-label">Nueva contrasena</label>
          <input type="password" name="password1" class="form-control" required minlength="4">
        </div>
        <div class="form-group" style="margin-bottom:1.25rem;">
          <label class="form-label">Confirmar contrasena</label>
          <input type="password" name="password2" class="form-control" required minlength="4">
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;">Cambiar contrasena</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
