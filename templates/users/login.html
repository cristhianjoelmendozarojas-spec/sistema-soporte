<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SISO - Iniciar Sesion</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --navy: #1e3a5f;
      --sidebar-bg: #1e2d40;
      --text-muted: #6b7280;
      --surface-ground: #f4f6f9;
      --surface-card: #ffffff;
      --surface-border: #e5e7eb;
      --radius-lg: 12px;
      --radius-sm: 6px;
      --shadow-lg: 0 25px 50px rgba(0,0,0,.4);
      --red: #dc2626;
      --red-lt: #fef2f2;
      --red-border: #fecaca;
      --green-lt: #f0fdf4;
      --green-border: #bbf7d0;
      --green: #16a34a;
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    html { font-size:13px; }
    body {
      font-family:'Inter',sans-serif;
      background: linear-gradient(135deg, #1e2d40 0%, #0f172a 50%, #1e3a5f 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
    }
    .login-container {
      display:flex;
      background: var(--surface-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow:hidden;
      max-width: 680px;
      width: 92%;
      min-height: 380px;
    }
    .login-side {
      background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
      width: 200px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 1.5rem;
      flex-shrink:0;
    }
    .login-side .brand-icon {
      width:52px; height:52px;
      background: var(--primary);
      border-radius: 12px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size: 1.5rem;
      margin-bottom:.8rem;
    }
    .login-side h1 {
      font-family:'Outfit',sans-serif;
      color:#e2e8f0;
      font-size:1.2rem;
      font-weight:700;
      text-align:center;
    }
    .login-side p {
      font-size:.68rem;
      color:rgba(255,255,255,.7);
      font-weight:600;
      letter-spacing:.1em;
      text-transform:uppercase;
      margin-top:.2rem;
    }
    .login-form {
      flex:1;
      padding: 2rem 2rem;
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .login-form h2 {
      font-family:'Outfit',sans-serif;
      font-size:1rem;
      font-weight:700;
      color: var(--navy);
      margin-bottom:.15rem;
    }
    .login-form .sub {
      font-size:.72rem;
      color: var(--text-muted);
      margin-bottom:1.2rem;
    }
    .form-group {
      display:flex;
      flex-direction:column;
      gap:.2rem;
      margin-bottom:.85rem;
    }
    .form-group label {
      font-size:.62rem; font-weight:700;
      color: var(--text-light);
      letter-spacing:.06em;
      text-transform:uppercase;
    }
    .form-group input {
      padding:.55rem .75rem;
      border:1.5px solid var(--surface-border);
      border-radius:var(--radius-sm);
      font-family:'Inter',sans-serif;
      font-size:.82rem;
      color: var(--navy);
      background:#fafafa;
      transition:all .2s;
      width:100%;
    }
    .form-group input:focus {
      outline:none;
      border-color:var(--primary);
      background:#fff;
      box-shadow:0 0 0 3px rgba(37,99,235,.1);
    }
    .form-group input::placeholder {
      color: #b0b8c4;
      font-size:.75rem;
    }
    .btn-submit {
      padding:.52rem .9rem;
      border-radius:var(--radius-sm);
      font-family:'Inter',sans-serif;
      font-size:.8rem; font-weight:700;
      cursor:pointer;
      border:1px solid transparent;
      background: var(--primary);
      color: #fff;
      width:100%;
      transition:all .14s;
      margin-top:.4rem;
      letter-spacing:.02em;
    }
    .btn-submit:hover { background: var(--primary-dark); transform:translateY(-1px); box-shadow:0 4px 12px rgba(37,99,235,.3); }
    .alert {
      padding:.6rem .8rem;
      border-radius:var(--radius-sm);
      margin-bottom:.85rem;
      font-size:.75rem; font-weight:500;
      border:1px solid;
      display:flex; align-items:center; gap:.4rem;
    }
    .alert-error { background:var(--red-lt); color:var(--red); border-color:var(--red-border); }
    .alert-success { background:var(--green-lt); color:var(--green); border-color:var(--green-border); }
    @media (max-width:700px) {
      .login-container {
        flex-direction:column;
        min-height:auto;
        max-width:400px;
      }
      .login-side {
        width:100%;
        padding:1.2rem;
        flex-direction:row;
        gap:.65rem;
      }
      .login-side .brand-icon {
        width:40px; height:40px;
        font-size:1.1rem;
        margin-bottom:0;
      }
      .login-side h1 { font-size:.9rem; text-align:left; }
      .login-side p { font-size:.6rem; text-align:left; }
      .login-form { padding:1.3rem; }
    }
    @media (max-width:380px) {
      .login-form { padding:1rem; }
      .login-form h2 { font-size:.9rem; }
      .login-side { padding:.9rem; gap:.5rem; }
      .login-side .brand-icon { width:34px; height:34px; font-size:.95rem; }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-side">
      <div class="brand-icon">🔧</div>
      <h1>SISO</h1>
      <p>Sistema Soporte</p>
    </div>
    <div class="login-form">
      <h2>Iniciar Sesion</h2>
      <p class="sub">Ingrese su DNI y contrasena</p>

      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags %}{{ message.tags }}{% else %}success{% endif %}">{{ message }}</div>
        {% endfor %}
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label>DNI</label>
          <input type="text" name="username" placeholder="Ingrese su DNI" required autofocus>
        </div>
        <div class="form-group">
          <label>Contrasena</label>
          <input type="password" name="password" placeholder="Ingrese su contrasena" required>
        </div>
        <button type="submit" class="btn-submit">Ingresar</button>
      </form>
    </div>
  </div>
</body>
</html>
